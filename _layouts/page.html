---
layout: default
---
<section class="wrap page">
  <header class="page__header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="page__body{% if page.photo %} page__body--with-photo{% endif %}">
    {% if page.photo %}
    <figure class="page__photo">
      {% comment %}
        Photos render at their natural shape by default, so landscape and
        portrait both work. Set photo_ratio (e.g. "4 / 5") to crop instead.
      {% endcomment %}
      <img src="{{ page.photo | relative_url }}"
           alt="{{ page.photo_alt | default: site.author.name }}"
           {% if page.photo_ratio %}style="aspect-ratio: {{ page.photo_ratio }}; object-fit: cover;"{% endif %}>
      {% if page.photo_caption %}<figcaption>{{ page.photo_caption }}</figcaption>{% endif %}
    </figure>
    {% endif %}

    <div class="prose">
      {{ content }}
    </div>
  </div>
</section>
