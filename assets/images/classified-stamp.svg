<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A red rubber stamp reading CLASSIFIED">
  <!--
    Original artwork, drawn rather than sourced, so there is no stock licence
    hanging over a public page. viewBox is 16:9 to match the card tile exactly,
    so object-fit: cover crops nothing.

    The turbulence filter is what makes it read as a worn rubber stamp instead
    of clip art. Low displacement on purpose: push it past about 4 and the
    letterforms start to come apart.
  -->
  <defs>
    <filter id="stamp-wear" x="-8%" y="-18%" width="116%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g transform="rotate(-7 320 180)" filter="url(#stamp-wear)" opacity="0.9">
    <rect x="72" y="110" width="496" height="140" rx="16"
          fill="none" stroke="#c0342b" stroke-width="11"/>
    <!--
      textLength pins the word to a fixed width so it cannot spill past the
      border on a machine that lacks Arial Black and falls back to something
      wider. Without it the letters overhang the frame by about 17px a side.
    -->
    <text x="320" y="202" text-anchor="middle" fill="#c0342b"
          font-family="Arial Black, Arial Bold, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="900"
          textLength="430" lengthAdjust="spacingAndGlyphs">CLASSIFIED</text>
  </g>
</svg>
