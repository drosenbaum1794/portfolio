# ------------------------------------------------------------------
# Site-wide settings. This is the first place to edit: your name,
# tagline, and the links in the footer/nav all come from here.
# ------------------------------------------------------------------

title: "Dan Rosenbaum"
tagline: "AI tooling people love to use"
description: >-
  I build AI tools inside real companies, then go back months later to find
  out who is still using them.

# Used to build absolute URLs. The site runs on a custom apex domain, so it
# serves from the root and baseurl stays empty. The CNAME file at the repo
# root is what tells GitHub Pages about the domain; these two only affect
# canonical URLs, the sitemap, and the feed.
url: "https://dan-rosenbaum.com"
baseurl: ""

# When true, projects without a video show a "coming soon" slot on their page.
# Off by default. Projects that do have a video always show it either way.
show_video_placeholders: false

author:
  name: "Dan Rosenbaum"
  email: "drosenbaum1794@gmail.com"
  location: "Beverly, MA"
  linkedin: "https://www.linkedin.com/in/daniel-rosenbaum-aa283b188/"
  # Homepage portrait. Cropped to 4:5 by the layout.
  photo: "/assets/images/dan-hero.jpg"
  photo_alt: "Dan Rosenbaum, smiling with arms crossed"

# ------------------------------------------------------------------
# Collections. Projects live here as individual markdown files.
# See README.md for how to add a new one.
# ------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
