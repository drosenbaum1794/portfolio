# ------------------------------------------------------------------
# Site-wide settings. This is the first place to edit: your name,
# tagline, and the links in the footer/nav all come from here.
# ------------------------------------------------------------------

title: "Dan Rosenbaum"
tagline: "AI enablement, education, and tools that get used"
description: >-
  I build AI tools people actually adopt, and I measure whether they keep
  using them.

# Used to build absolute URLs (leave baseurl blank for a *.github.io user site,
# or set it to "/your-repo-name" for a project site. See README).
url: "https://drosenbaum1794.github.io"
baseurl: "/portfolio"

author:
  name: "Dan Rosenbaum"
  email: "drosenbaum1794@gmail.com"
  location: "Beverly, MA"
  linkedin: "https://www.linkedin.com/in/daniel-rosenbaum-aa283b188/"

# ------------------------------------------------------------------
# Collections — projects live here as individual markdown files.
# See README.md for how to add a new one.
# ------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
